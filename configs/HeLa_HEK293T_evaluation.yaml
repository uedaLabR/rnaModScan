# Frozen manuscript settings; only input/output/model/catalog paths adapted.
# Fresh lossless-integer Parquet v4; four independent CPU group workers.
schema_version: 1
mode: predict
genome: hg38
output_dir: ../output/HeLa_WT_HEKonly
targets:
- m6A
- m5C
- inosine
- pseU
modkit:
  run_pileup: false
  executable: modkit
  threads: 4
  filter_threshold: null
  mod_thresholds: null
  include_bed: null
  seed: null
filtering:
  reference_only_targets:
  - m5C
  - pseU
  m6a_drach_keep: true
references:
  fasta: /inputs/hg38.fa
  gtf: /inputs/gencode.v44.annotation.gff3
  catalog: ../data/references/hg38/catalog.json
sample:
  sample_id: HeLa_WT
  cell: HeLa
  reference_cell: HeLa
  condition: WT
  bedmethyl: /inputs/HeLa_WT.all_modifications.bed
  pileup_log: /inputs/HeLa_WT.pileup.log
  bam: /inputs/HeLa_WT.sorted.bam
  enabled: true
model_root: null
model_directories:
  adenine: ../models/HEK293T_evaluation_20261124/adenine
recalibrate_bam: false
bam_threads: 2
features:
  flank: 9
  min_mapq: 0
  bam_threads: 1
  progress_seconds: 60
  candidate_group_gap: 10000
  read_batch_size: 256
  sample_workers: 1
  group_workers: 4
  group_batch_size: 16
  max_fetch_span: 10000000
candidates:
  min_depth: 10
  min_modified: 3
  min_af: 0.1
nn:
  task: adenine_three_class
  batch_sites: 16
  device: gpu
  cpu_threads: 4
quality:
  percentile: 0.1
  sample_fraction: 1.0
  seed: 42
  only_aligned: true
