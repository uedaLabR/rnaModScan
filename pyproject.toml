[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnamodscan"
version = "0.1.0"
description = "Dorado DRS RNA modification filtering with training and prediction workflows"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
quality = ["pysam>=0.22", "matplotlib>=3.7"]
training = ["pysam>=0.22", "pyarrow>=14", "tensorflow>=2.16,<2.20", "matplotlib>=3.7"]
prediction-cpu = ["pysam>=0.22", "pyarrow>=14", "tensorflow-cpu>=2.16,<2.20"]

[project.scripts]
rnamodscan = "rnamodscan.cli:main"

[tool.setuptools.packages.find]
include = ["rnamodscan*", "training*", "prediction*", "utils*"]
namespaces = false

[tool.setuptools.package-data]
training = ["config.yaml"]
prediction = ["config.yaml"]
